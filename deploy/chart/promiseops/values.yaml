# Defaults shared by every environment. values-staging.yaml / values-prod.yaml override them.
# CI always sets image.repository and image.digest; a mutable tag is never deployed.

nameOverride: ""

image:
  repository: ""            # CI: $CI_REGISTRY_IMAGE/app
  digest: ""                # CI: sha256:... from build.json
  pullPolicy: IfNotPresent

# --- provided by staff in the staging and prod namespaces ---
serviceAccountName: ""      # empty = namespace default (staff: no dedicated account is needed)
imagePullSecrets:
  - name: registry-pull
runtimeSecretName: ""       # CI passes runtime-config (database URL and API key)

env:                        # non-secret settings only
  PROMISEOPS_RELEASE_DIR: /opt/promiseops/release
  PROMISEOPS_LOG_FORMAT: json

replicaCount: 1

# prod budget is 3 CPU / 3 GiB: 3 replicas + 1 surge pod at 750m / 768Mi fit exactly.
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 750m
    memory: 768Mi

service:
  port: 80
  annotations: {}           # scraping needs none: the platform Service promiseops-metrics selects the pods

podAnnotations: {}

probes:
  readiness:                # /readyz: validated model AND reachable DB
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:                 # /healthz: process alive only
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    periodSeconds: 2
    failureThreshold: 30    # up to 60 s to load the model bundle

shutdown:
  preStopSeconds: 10        # drain before SIGTERM
  terminationGracePeriodSeconds: 45

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  scaleUpStabilizationSeconds: 0
  scaleDownStabilizationSeconds: 120

# Pre-install/pre-upgrade hook Job: python -m promiseops.migrate applies the idempotent
# sql/*.sql files carried by the image. Rollback turns it off (schema is never rolled back).
migrations:
  enabled: true
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

priorityCronJob:
  enabled: false
  schedule: "15 * * * *"
  suspend: false
  startingDeadlineSeconds: 300
  activeDeadlineSeconds: 900
  args: ["score-priority"]  # promiseops CLI subcommand (owner: Armina)
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi
